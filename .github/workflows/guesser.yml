name: Auto Matka Guesser 1-Minute Live

on:
  schedule:
    # GitHub ಪ್ರತಿ 5 ನಿಮಿಷಕ್ಕೆ ವರ್ಕ್‌ಫ್ಲೋ ಟ್ರಿಗರ್ ಮಾಡುತ್ತದೆ
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-guesser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Guesser Every 1 Minute Loop
        run: |
          for i in {1..5}
          do
            echo "--- Scan Run #$i at $(date) ---"
            node auto-guesser.js
            echo "Sleeping for 60 seconds..."
            sleep 60
          done
